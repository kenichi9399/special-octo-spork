["1","2","3","4","5","6","7","8","9","けす","0","OK"].forEach(l=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>{if(l==="けす")input="";else if(l==="OK"){if(input==="123"){gateOpen=true;gate.visible=false;colliders.splice(colliders.indexOf(gate),1);closePad();toast("扉がひらいた！")}else{input="";toast("もういちど数字を見てみよう。")}}else if(input.length<3)input+=l;code.textContent=input.padEnd(4,"-")};document.getElementById("keys").append(b)});
