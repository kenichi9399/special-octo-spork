<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>いきもの たからさがし 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7dbfd1;font-family:system-ui,"Yu Gothic UI",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1}.closeGoal,.openGoal{position:fixed;right:10px;top:58px;z-index:2147483000;pointer-events:auto;touch-action:manipulation;border:1px solid rgba(35,51,51,.2);background:rgba(255,255,255,.96);box-shadow:0 8px 18px rgba(20,40,50,.18);font-weight:900}.closeGoal{width:38px;height:38px;border-radius:50%;font-size:22px}.openGoal{border-radius:999px;padding:9px 13px;display:none}@media(max-width:760px),(pointer:coarse){.closeGoal,.openGoal{top:auto;right:10px;bottom:74px}}</style></head><body><iframe id="shell" src="./v41.html?fresh=5" allow="fullscreen"></iframe><button type="button" class="closeGoal" id="closeGoal">×</button><button type="button" class="openGoal" id="openGoal">もくひょう</button><script>
window.goalHidden=false;
window.applyGoalState=function(){const c=document.getElementById('closeGoal'),o=document.getElementById('openGoal'),sh=document.getElementById('shell');c.style.display=window.goalHidden?'none':'block';o.style.display=window.goalHidden?'block':'none';try{const d=sh.contentDocument;const g=d&&d.querySelector('.goal');if(g)g.style.display=window.goalHidden?'none':'block';const inner=d&&d.querySelector('#game');const gd=inner&&inner.contentDocument;if(gd&&!gd.getElementById('v44-style')){const st=gd.createElement('style');st.id='v44-style';st.textContent='.respawn{left:50%!important;right:auto!important;bottom:154px!important;translate:-50% 0!important;z-index:30!important}.padWrap{z-index:25!important}.joy{z-index:25!important}.jump{z-index:25!important}@media(min-width:900px){.respawn{bottom:18px!important}}';gd.head.appendChild(st)}}catch(e){}};
window.hideGoal=function(){window.goalHidden=true;window.applyGoalState()};window.showGoal=function(){window.goalHidden=false;window.applyGoalState()};
function bind(id,fn){const b=document.getElementById(id);b.onclick=fn;b.onpointerdown=e=>{e.preventDefault();fn()};b.ontouchstart=e=>{e.preventDefault();fn()}}
bind('closeGoal',window.hideGoal);bind('openGoal',window.showGoal);setInterval(window.applyGoalState,500);document.getElementById('shell').addEventListener('load',()=>setTimeout(window.applyGoalState,1200));
</script></body></html>
