name: Apply v24 spin fix and realism

on:
  push:
    paths:
      - '.github/workflows/apply-v24-spin-realism.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('fireflies=[];','fireflies=[],reeds=[],mushrooms=[],leaves=[],mist=[];')
          s=s.replace('for(let i=0;i<24;i++)fireflies.push([Math.sin(i*4.9)*34,1.8+((i*7)%10)/7,Math.cos(i*5.7)*34,i*.73]);', 'for(let i=0;i<24;i++)fireflies.push([Math.sin(i*4.9)*34,1.8+((i*7)%10)/7,Math.cos(i*5.7)*34,i*.73]);\nfor(let i=0;i<46;i++){const w=waters[i%waters.length],a=i*.61,d=(w[2]||10)*(.75+((i*7)%9)/30);reeds.push([w[0]+Math.cos(a)*d,w[1]+Math.sin(a)*d,.65+((i*5)%8)/10,a])}\nfor(let i=0;i<24;i++)mushrooms.push([Math.sin(i*8.6)*42,Math.cos(i*5.8)*42,.4+((i*3)%7)/15,i%2]);\nfor(let i=0;i<42;i++)leaves.push([Math.sin(i*4.2)*50,Math.cos(i*9.5)*50,i*.4]);\nfor(let i=0;i<10;i++)mist.push([Math.sin(i*3.1)*36,.75+((i*4)%8)/12,Math.cos(i*4.4)*36,4+((i*5)%5),i*.9]);')
          s=s.replace('for(let i=0;i<18;i++)obj(M.box,-35+i*4,hgt(-35+i*4,5+Math.sin(i)*3)+.05,5+Math.sin(i)*3,1.8,.05,1.0,[.83,.69,.43],.4);for(const w of waters)', 'for(let i=-5;i<=5;i++)for(let j=-5;j<=5;j++)if((i+j*j)%4===0)obj(M.sphere,i*9,hgt(i*9,j*9)+.01,j*9,2.7,.025,2.2,[.18+.02*(i%2),.43+.04*(j%2),.32],0,0,.28);for(let i=0;i<18;i++)obj(M.box,-35+i*4,hgt(-35+i*4,5+Math.sin(i)*3)+.05,5+Math.sin(i)*3,1.8,.05,1.0,[.83,.69,.43],.4);for(const w of waters)')
          s=s.replace('for(const r of rocks){shade(r[0],r[1],r[2]*.22);', 'for(const rd of reeds)obj(M.cone,rd[0],hgt(rd[0],rd[1])+.38,rd[1],.07,.62*rd[2],.07,[.16,.43,.25],rd[3]+Math.sin(t+rd[0])*.12);for(const lf of leaves)obj(M.sphere,lf[0],hgt(lf[0],lf[1])+.045,lf[1],.28,.018,.12,[.64,.40,.20],lf[2]);for(const r of rocks){shade(r[0],r[1],r[2]*.22);')
          s=s.replace('for(const g of grass)obj(M.cone,g[0],hgt(g[0],g[1])+.22,g[1],.08*g[2],.35*g[2],.08*g[2],[.20,.58,.34],Math.sin(t+g[0])*.25);for(const f of flowers)', 'for(const g of grass)obj(M.cone,g[0],hgt(g[0],g[1])+.22,g[1],.08*g[2],.35*g[2],.08*g[2],[.20,.58,.34],Math.sin(t+g[0])*.25);for(const m of mushrooms){obj(M.box,m[0],hgt(m[0],m[1])+.18,m[1],.08*m[2],.22*m[2],.08*m[2],[.86,.78,.60]);obj(M.sphere,m[0],hgt(m[0],m[1])+.42,m[1],.22*m[2],.12*m[2],.22*m[2],m[3]?[.75,.28,.32]:[.72,.56,.86])}for(const f of flowers)')
          s=s.replace('for(const fl of fireflies)obj(M.sphere,fl[0]+Math.sin(t+fl[3])*.7,fl[1]+Math.sin(t*1.7+fl[3])*.35,fl[2]+Math.cos(t+fl[3])*.7,.07,.07,.07,[.9,1,.45],0,0,.78);if(movePower>.15)', 'for(const fl of fireflies)obj(M.sphere,fl[0]+Math.sin(t+fl[3])*.7,fl[1]+Math.sin(t*1.7+fl[3])*.35,fl[2]+Math.cos(t+fl[3])*.7,.07,.07,.07,[.9,1,.45],0,0,.78);for(const ms of mist)obj(M.sphere,ms[0]+Math.sin(t*.18+ms[4])*1.4,ms[1],ms[2]+Math.cos(t*.16+ms[4])*1.2,ms[3],.10,ms[3]*.75,[.82,.94,.90],0,0,.13);if(movePower>.15)')
          s=s.replace(';camDir=angleStep(camDir,dir,.055);vy-=', ';vy-=')
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          if sw.exists():
            sw.write_text(sw.read_text(encoding='utf-8').replace('ikimono-hunt-v23','ikimono-hunt-v24'),encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply v24 spin fix and realism"
          git push origin HEAD:main
