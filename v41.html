<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>いきもの たからさがし 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7dbfd1;font-family:system-ui,"Yu Gothic UI",sans-serif;color:#21343a}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.pill,.goal,.badge,.toast{background:rgba(255,255,255,.92);border:1px solid rgba(35,51,51,.16);box-shadow:0 8px 18px rgba(20,40,50,.14);font-weight:900}.pill{position:fixed;left:50%;top:10px;translate:-50% 0;border-radius:999px;padding:8px 13px;pointer-events:none}.goal{position:fixed;right:12px;top:76px;width:min(286px,44vw);border-radius:8px;padding:10px 12px;pointer-events:none}.badge{position:fixed;left:12px;top:76px;border-radius:8px;padding:10px 12px;min-width:130px;pointer-events:none}.line{display:flex;gap:6px;align-items:baseline;margin-top:5px;font-size:12px;line-height:1.35}.label{background:#35a66d;color:#fff;border-radius:999px;padding:2px 7px;white-space:nowrap}.label.next{background:#f4b653;color:#21343a}.label.done{background:#89a2b7}.rank{display:inline-block;margin-left:5px;background:#f4b653;border-radius:999px;padding:3px 8px}.bar{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}.dot{height:7px;border-radius:999px;background:#d9e2dd}.dot.on{background:#35a66d}.tasks{display:grid;gap:5px;margin-top:8px}.task{display:flex;justify-content:space-between;gap:8px;border-radius:8px;background:rgba(255,255,255,.65);padding:5px 7px;font-size:12px}.task.done{background:rgba(116,205,146,.38)}.spark{position:fixed;left:50%;top:96px;translate:-50% 0;font-size:28px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2));animation:p 1.2s infinite;pointer-events:none}.toast{position:fixed;left:50%;top:145px;translate:-50% 0;border-radius:999px;padding:8px 13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@keyframes p{50%{transform:translateY(-7px) scale(1.08)}}@media(max-width:760px),(pointer:coarse){.goal{top:auto;right:10px;bottom:112px;width:min(226px,49vw);font-size:12px}.badge{top:58px;left:10px;font-size:12px;min-width:112px}.pill{font-size:12px;top:8px}.spark{top:92px}.toast{top:132px;font-size:12px}.task,.line{font-size:11px}}</style></head><body><iframe id="game" src="./v36.html?fresh=6" allow="fullscreen"></iframe><div class="pill" id="guide">つぎの いきものを さがそう</div><section class="badge"><div id="type">タイプ: たんけん</div><div class="line"><span class="label">とくい</span><span id="typeHint">きらりを さがそう</span></div></section><section class="goal"><div>もくひょう <span class="rank" id="rank">たまご</span></div><div class="line"><span class="label">いま</span><span id="nowGoal">あたらしい いきものを さがそう</span></div><div class="line"><span class="label next">つぎ</span><span id="nextGoal">みつけたら へんしん</span></div><div class="line"><span class="label done">できた</span><span id="doneGoal">まだ これから</span></div><div class="bar" id="bar"></div><div class="tasks"><div class="task" id="t1"><span>3びき みつける</span><b>まだ</b></div><div class="task" id="t2"><span>へんしんする</span><b>まだ</b></div><div class="task" id="t3"><span>ジャンプする</span><b>まだ</b></div></div></section><div class="spark">✦</div><div class="toast" id="toast">できた！</div><script>
const f=document.getElementById('game'),guide=document.getElementById('guide'),rank=document.getElementById('rank'),nowGoal=document.getElementById('nowGoal'),nextGoal=document.getElementById('nextGoal'),doneGoal=document.getElementById('doneGoal'),bar=document.getElementById('bar'),type=document.getElementById('type'),typeHint=document.getElementById('typeHint'),toast=document.getElementById('toast'),tasks=[document.getElementById('t1'),document.getElementById('t2'),document.getElementById('t3')];let tick=0,lastRank='',jumpDone=false,shift=0,hooked=false,patched=false;
bar.innerHTML=Array.from({length:8},(_,i)=>'<i class="dot" id="d'+i+'"></i>').join('');
function rankName(n){return n>=12?'もりの せんせい':n>=8?'はかせ':n>=5?'たんけんか':n>=2?'みならい':'たまご'}
function pop(t){toast.textContent=t;toast.classList.add('show');clearTimeout(pop.t);pop.t=setTimeout(()=>toast.classList.remove('show'),1300)}
function setTask(i,done){const was=tasks[i].classList.contains('done');tasks[i].classList.toggle('done',done);tasks[i].querySelector('b').textContent=done?'できた':'まだ';if(done&&!was)pop('できた！')}
function inject(d){if(patched||!d||!d.body||!d.querySelector('#jump'))return;const sc=d.createElement('script');sc.textContent=`(function(){if(window.__v41)return;window.__v41=1;const oldCreature=creature;creature=function(a,x,z,y,s=1,yaw=dir,t=0){oldCreature(a,x,z,y,s,yaw,t);const d=Math.hypot(x-px,z-pz),close=d<4.8||Math.abs(x-px)<.001&&Math.abs(z-pz)<.001;if(!close||quality<.64)return;const c=a.color||[.3,.6,.7],ac=a.accent||[1,.8,.5],kind=a.kind||'kid',tm=performance.now()/1000,bob=Math.sin(tm*4+yaw)*.035*s;const f=[Math.sin(yaw),Math.cos(yaw)],sd=[Math.cos(yaw),-Math.sin(yaw)],at=(lx,lz)=>[x+sd[0]*lx*s+f[0]*lz*s,z+sd[1]*lx*s+f[1]*lz*s],lift=y+bob,br=(v,k)=>v.map(n=>Math.min(1,n+k));obj(M.detail,x,lift+.83*s,z-.06*s,.42*s,.045*s,.52*s,br(c,.16),yaw,0,.26);obj(M.detail,x+Math.sin(yaw)*.57*s-.12*Math.cos(yaw)*s,lift+1.12*s,z+Math.cos(yaw)*.57*s+.12*Math.sin(yaw)*s,.026*s,.026*s,.026*s,[1,1,.96],0);obj(M.detail,x+Math.sin(yaw)*.57*s+.12*Math.cos(yaw)*s,lift+1.12*s,z+Math.cos(yaw)*.57*s-.12*Math.sin(yaw)*s,.026*s,.026*s,.026*s,[1,1,.96],0);if(kind==='wing'){for(let r=0;r<3;r++)for(const lx of[-.58,.58]){const q=at(lx,.02-r*.08);obj(M.detail,q[0],lift+(.88-r*.07)*s+Math.sin(tm*12+r)*.05*s,q[1],(.19-r*.025)*s,.018*s,.10*s,br(ac,.08+r*.03),yaw+lx*.28,Math.sin(tm*11+lx+r)*.55,.58)}const q=at(0,.76);obj(M.fineCone,q[0],lift+1.03*s,q[1],.075*s,.50*s,.075*s,br(ac,.10),yaw,Math.PI/2,.90)}if(kind==='water'){for(let i=-3;i<=3;i++){const q=at(i*.10,.08+Math.sin(tm*5+i)*.04);obj(M.detail,q[0],lift+.94*s,q[1],.035*s,.014*s,.05*s,br(ac,.08),yaw,0,.55)}for(const lx of[-.38,.38]){const q=at(lx,-.16);obj(M.detail,q[0],lift+.70*s,q[1],.13*s,.022*s,.28*s,br(ac,.05),yaw+Math.sin(tm*7)*.30,0,.56)}}if(kind==='armor'||kind==='rock'){for(let r=0;r<3;r++){obj(M.detail,x,lift+(.92+r*.08)*s,z-(.18+r*.06)*s,.46*s,.030*s,.16*s,br(ac,.04+r*.03),yaw,0,.48)}}if(kind==='crystal'){obj(M.detail,x,lift+1.34*s,z,.52*s,.055*s,.52*s,[.88,1,1],yaw,0,.46);obj(M.fineCone,x,lift+1.52*s,z,.11*s,.38*s,.11*s,[.70,.98,1],yaw+tm*.5,0,.65)}if(a.id==='okapi')for(let i=-3;i<=3;i++){const q=at(.34,-.22+i*.09);obj(M.box,q[0],lift+.54*s,q[1],.022*s,.25*s,.022*s,[.98,.96,.88],yaw)}};document.body.dataset.v41='1';})();`;d.body.appendChild(sc);patched=true}
function read(){try{const d=f.contentDocument;if(!d||!d.body)return null;inject(d);if(!hooked){const j=d.querySelector('#jump');if(j){hooked=true;['click','pointerdown','touchstart'].forEach(ev=>j.addEventListener(ev,()=>{jumpDone=true;pop('ジャンプ できた！')},{passive:true}))}}const score=d.querySelector('#score')?.textContent||'0 / 16';return{n:parseInt(score.split('/')[0])||0,total:parseInt(score.split('/')[1])||16,kind:d.body.dataset.kind||'',y:parseFloat(d.body.dataset.y||0)||0,hint:d.querySelector('#hint')?.textContent||'',drawn:d.body.dataset.drawn,error:d.body.dataset.error||'',v41:d.body.dataset.v41||''}}catch(e){return null}}
function update(){const g=read();if(!g){guide.textContent='3Dを よみこみちゅう';return}if(g.y>.12)jumpDone=true;const rn=rankName(g.n);if(lastRank&&rn!==lastRank)pop('ランク: '+rn);lastRank=rn;rank.textContent=rn;const left=Math.max(0,g.total-g.n),morphed=!!(g.kind&&g.kind!=='kid');nowGoal.textContent=left===0?'ぜんぶ みつけた！':!morphed?'ずかんで へんしんしよう':!jumpDone?'ジャンプを ためそう':'あたらしい いきものを さがそう';nextGoal.textContent=left===0?'おきにいりで あそぼう':g.kind==='wing'?'そらから さがそう':g.kind==='water'?'みずべを さがそう':left<=8?'のこり '+left+' びき':'きらりを さがそう';doneGoal.textContent=[g.n>=3?'3びき':null,morphed?'へんしん':null,jumpDone?'ジャンプ':null].filter(Boolean).join(' / ')||'まだ これから';for(let i=0;i<8;i++)document.getElementById('d'+i).classList.toggle('on',i<Math.min(8,g.n));setTask(0,g.n>=3);setTask(1,morphed);setTask(2,jumpDone);if(g.kind==='wing'){type.textContent='タイプ: とぶ';typeHint.textContent=g.y>.2?'あしあと なしで ふわふわ':'ジャンプで とべる'}else if(g.kind==='water'){type.textContent='タイプ: およぐ';typeHint.textContent='みずべでは あしあと なし'}else if(g.kind==='rock'||g.kind==='armor'){type.textContent='タイプ: まもる';typeHint.textContent='いわや うんちに つよい'}else if(g.kind==='run'){type.textContent='タイプ: はしる';typeHint.textContent='まっすぐ すすむと はやい'}else{type.textContent='タイプ: たんけん';typeHint.textContent='きらりを さがそう'}const msgs=g.kind==='wing'&&g.y>.2?['はねで ふわふわ','そらから さがそう','あしあと なし']:g.kind==='water'?['みずべを さがそう','およいで すすもう','みずでは あしあと なし']:['きらりを さがそう','いわや きの うらも みよう','みつけたら ずかんへ'];guide.textContent=msgs[(tick+shift)%msgs.length];tick++;if(tick%5===0)shift++}
setInterval(update,500);setTimeout(update,1800);
</script></body></html>
