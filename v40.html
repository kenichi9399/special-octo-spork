<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>いきもの たからさがし 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7dbfd1;font-family:system-ui,"Yu Gothic UI",sans-serif;color:#21343a}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.pill,.goal,.badge,.toast{background:rgba(255,255,255,.92);border:1px solid rgba(35,51,51,.16);box-shadow:0 8px 18px rgba(20,40,50,.14);font-weight:900}.pill{position:fixed;left:50%;top:10px;translate:-50% 0;border-radius:999px;padding:8px 13px;pointer-events:none}.goal{position:fixed;right:12px;top:82px;width:min(270px,42vw);border-radius:8px;padding:10px 12px;pointer-events:none}.goal small,.badge small{display:block;margin-top:4px;font-size:12px;line-height:1.35}.rank{display:inline-block;margin-left:5px;background:#f4b653;border-radius:999px;padding:3px 8px}.badge{position:fixed;left:12px;top:82px;border-radius:8px;padding:10px 12px;min-width:130px;pointer-events:none}.bar{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}.dot{height:7px;border-radius:999px;background:#d9e2dd}.dot.on{background:#35a66d}.tasks{display:grid;gap:6px;margin-top:9px}.task{display:flex;justify-content:space-between;gap:8px;border-radius:8px;background:rgba(255,255,255,.65);padding:5px 7px;font-size:12px}.task.done{background:rgba(116,205,146,.38)}.spark{position:fixed;left:50%;top:96px;translate:-50% 0;font-size:28px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2));animation:p 1.2s infinite;pointer-events:none}.toast{position:fixed;left:50%;top:145px;translate:-50% 0;border-radius:999px;padding:8px 13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@keyframes p{50%{transform:translateY(-7px) scale(1.08)}}@media(max-width:760px),(pointer:coarse){.goal{top:auto;right:10px;bottom:112px;width:min(218px,47vw);font-size:12px}.badge{top:58px;left:10px;font-size:12px;min-width:112px}.pill{font-size:12px;top:8px}.spark{top:92px}.toast{top:132px;font-size:12px}.tasks{gap:4px}.task{font-size:11px;padding:4px 6px}}</style></head><body><iframe id="game" src="./v36.html?fresh=5" allow="fullscreen"></iframe><div class="pill" id="guide">つぎの いきものを さがそう</div><section class="badge"><div id="type">タイプ: たんけん</div><small id="typeHint">きらりを さがそう</small></section><section class="goal"><div>もくひょう <span class="rank" id="rank">たまご</span></div><small id="goal">まずは 3びき みつけよう</small><div class="bar" id="bar"></div><div class="tasks"><div class="task" id="t1"><span>3びき みつける</span><b>まだ</b></div><div class="task" id="t2"><span>へんしんする</span><b>まだ</b></div><div class="task" id="t3"><span>ジャンプする</span><b>まだ</b></div></div></section><div class="spark">✦</div><div class="toast" id="toast">できた！</div><script>
const f=document.getElementById('game'),guide=document.getElementById('guide'),rank=document.getElementById('rank'),goal=document.getElementById('goal'),bar=document.getElementById('bar'),type=document.getElementById('type'),typeHint=document.getElementById('typeHint'),toast=document.getElementById('toast'),tasks=[document.getElementById('t1'),document.getElementById('t2'),document.getElementById('t3')];let tick=0,lastRank='',jumpDone=false,shift=0,hooked=false;
bar.innerHTML=Array.from({length:8},(_,i)=>'<i class="dot" id="d'+i+'"></i>').join('');
function rankName(n){return n>=12?'もりの せんせい':n>=8?'はかせ':n>=5?'たんけんか':n>=2?'みならい':'たまご'}
function pop(t){toast.textContent=t;toast.classList.add('show');clearTimeout(pop.t);pop.t=setTimeout(()=>toast.classList.remove('show'),1300)}
function setTask(i,done){const was=tasks[i].classList.contains('done');tasks[i].classList.toggle('done',done);tasks[i].querySelector('b').textContent=done?'できた':'まだ';if(done&&!was)pop('できた！')}
function read(){try{const d=f.contentDocument;if(!d||!d.body)return null;if(!hooked){const j=d.querySelector('#jump');if(j){hooked=true;['click','pointerdown','touchstart'].forEach(ev=>j.addEventListener(ev,()=>{jumpDone=true;pop('ジャンプ できた！')},{passive:true}))}}const score=d.querySelector('#score')?.textContent||'0 / 16';return{n:parseInt(score.split('/')[0])||0,total:parseInt(score.split('/')[1])||16,kind:d.body.dataset.kind||'',y:parseFloat(d.body.dataset.y||0)||0,hint:d.querySelector('#hint')?.textContent||'',drawn:d.body.dataset.drawn,error:d.body.dataset.error||''}}catch(e){return null}}
function update(){const g=read();if(!g){guide.textContent='3Dを よみこみちゅう';return}if(g.y>.12)jumpDone=true;const rn=rankName(g.n);if(lastRank&&rn!==lastRank)pop('ランク: '+rn);lastRank=rn;rank.textContent=rn;const left=Math.max(0,g.total-g.n);goal.textContent=left===0?'ぜんぶ みつけた！':g.n<3?'まずは 3びき みつけよう':'あと '+left+' びき さがそう';for(let i=0;i<8;i++)document.getElementById('d'+i).classList.toggle('on',i<Math.min(8,g.n));setTask(0,g.n>=3);setTask(1,g.kind&&g.kind!=='kid');setTask(2,jumpDone);if(g.kind==='wing'){type.textContent='タイプ: とぶ';typeHint.textContent=g.y>.2?'あしあと なしで ふわふわ':'ジャンプで とべる'}else if(g.kind==='water'){type.textContent='タイプ: およぐ';typeHint.textContent='みずべでは あしあと なし'}else if(g.kind==='rock'||g.kind==='armor'){type.textContent='タイプ: まもる';typeHint.textContent='いわや うんちに つよい'}else if(g.kind==='run'){type.textContent='タイプ: はしる';typeHint.textContent='まっすぐ すすむと はやい'}else{type.textContent='タイプ: たんけん';typeHint.textContent='きらりを さがそう'}const msgs=g.kind==='wing'&&g.y>.2?['はねで ふわふわ','そらから さがそう','あしあと なし']:g.kind==='water'?['みずべを さがそう','およいで すすもう','みずでは あしあと なし']:['きらりを さがそう','いわや きの うらも みよう','みつけたら ずかんへ'];guide.textContent=msgs[(tick+shift)%msgs.length];tick++;if(tick%5===0)shift++}
setInterval(update,500);setTimeout(update,1800);
</script></body></html>
