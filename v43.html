<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>いきもの たからさがし 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7dbfd1;font-family:system-ui,"Yu Gothic UI",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1}.closeGoal,.openGoal{position:fixed;right:10px;top:58px;z-index:2147483000;pointer-events:auto;touch-action:manipulation;border:1px solid rgba(35,51,51,.2);background:rgba(255,255,255,.96);box-shadow:0 8px 18px rgba(20,40,50,.18);font-weight:900}.closeGoal{width:38px;height:38px;border-radius:50%;font-size:22px}.openGoal{border-radius:999px;padding:9px 13px;display:none}@media(max-width:760px),(pointer:coarse){.closeGoal,.openGoal{top:auto;right:10px;bottom:74px}}</style></head><body><iframe id="shell" src="./v41.html?fresh=4" allow="fullscreen"></iframe><button type="button" class="closeGoal" id="closeGoal" aria-label="とじる">×</button><button type="button" class="openGoal" id="openGoal">もくひょう</button><script>
const shell=document.getElementById('shell'),closeGoal=document.getElementById('closeGoal'),openGoal=document.getElementById('openGoal');let hidden=false;
function setGoal(show){hidden=!show;closeGoal.style.display=show?'block':'none';openGoal.style.display=show?'none':'block';patch()}
function bind(btn,fn){['click','pointerdown','touchstart'].forEach(ev=>btn.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();fn()}, {passive:false}))}
bind(closeGoal,()=>setGoal(false));bind(openGoal,()=>setGoal(true));
function patch(){try{const d=shell.contentDocument;if(!d)return;const g=d.querySelector('.goal');if(g)g.style.display=hidden?'none':'block';const inner=d.querySelector('#game');const gd=inner&&inner.contentDocument;if(gd&&!gd.getElementById('v43-style')){const st=gd.createElement('style');st.id='v43-style';st.textContent='.respawn{left:50%!important;right:auto!important;bottom:154px!important;translate:-50% 0!important;z-index:30!important}.padWrap{z-index:25!important}.joy{z-index:25!important}.jump{z-index:25!important}@media(min-width:900px){.respawn{bottom:18px!important}}';gd.head.appendChild(st)}}catch(e){}}
setInterval(patch,500);shell.addEventListener('load',()=>setTimeout(patch,1200));
</script></body></html>
