<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>いきもの たからさがし 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7dbfd1;font-family:system-ui,"Yu Gothic UI",sans-serif;color:#21343a}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#goalBox{position:fixed;right:10px;top:76px;width:min(270px,44vw);background:rgba(255,255,255,.93);border:1px solid rgba(35,51,51,.16);border-radius:8px;box-shadow:0 10px 24px rgba(20,40,50,.16);padding:10px 12px;font-weight:900;z-index:20}#goalBox button{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:1px solid #ccd;background:#fff;font-weight:900}#goalBox small{display:block;margin-top:6px;line-height:1.35}.openGoal{position:fixed;right:10px;top:76px;z-index:20;border-radius:999px;border:1px solid rgba(35,51,51,.18);background:rgba(255,255,255,.94);box-shadow:0 8px 18px rgba(20,40,50,.16);font-weight:900;padding:9px 13px;display:none}.hint{position:fixed;left:50%;top:10px;translate:-50% 0;background:rgba(255,255,255,.9);border-radius:999px;border:1px solid rgba(35,51,51,.16);padding:8px 12px;font-weight:900;box-shadow:0 8px 18px rgba(20,40,50,.14);z-index:19}@media(max-width:760px),(pointer:coarse){#goalBox{top:auto;right:10px;bottom:112px;width:min(226px,49vw);font-size:12px}.openGoal{top:auto;right:10px;bottom:74px}.hint{font-size:12px;top:8px}}</style></head><body><iframe id="game" src="./v36.html?fresh=7" allow="fullscreen"></iframe><div class="hint" id="hint">きらりを さがそう</div><section id="goalBox"><button id="closeGoal">×</button><div>もくひょう</div><small id="now">いま: あたらしい いきものを さがそう</small><small id="next">つぎ: みつけたら へんしん</small><small id="done">できた: まだ これから</small></section><button class="openGoal" id="openGoal">もくひょう</button><script>
const frame=document.getElementById('game'),box=document.getElementById('goalBox'),openBtn=document.getElementById('openGoal'),hint=document.getElementById('hint'),now=document.getElementById('now'),next=document.getElementById('next'),done=document.getElementById('done');let jump=false;
closeGoal.onclick=()=>{box.style.display='none';openBtn.style.display='block'};openBtn.onclick=()=>{box.style.display='block';openBtn.style.display='none'};
function patch(){try{const d=frame.contentDocument;if(!d)return;const st=d.getElementById('v45-style')||d.createElement('style');st.id='v45-style';st.textContent='.respawn{left:50%!important;right:auto!important;bottom:154px!important;translate:-50% 0!important;z-index:30!important}.padWrap{z-index:25!important}.joy{z-index:25!important}.jump{z-index:25!important}@media(min-width:900px){.respawn{bottom:18px!important}}';if(!st.parentNode)d.head.appendChild(st);const j=d.querySelector('#jump');if(j&&!j.dataset.v45){j.dataset.v45=1;['click','pointerdown','touchstart'].forEach(e=>j.addEventListener(e,()=>jump=true,{passive:true}))}const score=d.querySelector('#score')?.textContent||'0 / 16',n=parseInt(score)||0,k=d.body.dataset.kind||'',y=parseFloat(d.body.dataset.y||0)||0;if(y>.1)jump=true;now.textContent='いま: '+(!k||k==='kid'?'ずかんで へんしんしよう':!jump?'ジャンプを ためそう':'あたらしい いきものを さがそう');next.textContent='つぎ: '+(k==='wing'?'そらから さがそう':k==='water'?'みずべを さがそう':'きらりを さがそう');done.textContent='できた: '+[n>=3?'3びき':null,k&&k!=='kid'?'へんしん':null,jump?'ジャンプ':null].filter(Boolean).join(' / ')||'できた: まだ これから';hint.textContent=k==='wing'&&y>.2?'はねで ふわふわ':k==='water'?'みずべを さがそう':'きらりを さがそう'}catch(e){}}
setInterval(patch,500);frame.addEventListener('load',()=>setTimeout(patch,1200));
</script></body></html>
