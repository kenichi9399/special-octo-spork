<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>いきもの たからさがし 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7dbfd1;font-family:system-ui,"Yu Gothic UI",sans-serif;color:#21343a}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.top{position:fixed;left:50%;top:10px;translate:-50% 0;background:rgba(255,255,255,.92);border:1px solid rgba(35,51,51,.16);border-radius:999px;padding:8px 13px;font-weight:900;box-shadow:0 8px 18px rgba(20,40,50,.14);pointer-events:none}.goal{position:fixed;right:12px;top:82px;width:min(250px,42vw);background:rgba(255,255,255,.92);border:1px solid rgba(35,51,51,.16);border-radius:8px;padding:10px 12px;box-shadow:0 10px 24px rgba(20,40,50,.16);font-weight:900;pointer-events:none}.goal small{display:block;margin-top:4px;font-size:12px;line-height:1.35}.rank{display:inline-block;margin-left:5px;background:#f4b653;border-radius:999px;padding:3px 8px}.spark{position:fixed;left:50%;top:96px;translate:-50% 0;font-size:28px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2));animation:p 1.2s infinite;pointer-events:none}@keyframes p{50%{transform:translateY(-7px) scale(1.08)}}@media(max-width:760px),(pointer:coarse){.goal{top:auto;right:10px;bottom:112px;width:min(220px,46vw);font-size:12px}.top{font-size:12px}.spark{top:84px}}</style></head><body><iframe id="game" src="./v36.html?fresh=3" allow="fullscreen"></iframe><div class="top" id="guide">つぎの いきものを さがそう</div><section class="goal"><div>もくひょう <span class="rank" id="rank">たまご</span></div><small id="goal">まずは 3びき みつけよう</small></section><div class="spark">✦</div><script>
const f=document.getElementById('game'),guide=document.getElementById('guide'),rank=document.getElementById('rank'),goal=document.getElementById('goal');let tick=0;
function rankName(n){return n>=12?'もりの せんせい':n>=8?'はかせ':n>=5?'たんけんか':n>=2?'みならい':'たまご'}
function update(){let n=0,total=16,kind='',y=0,hint='';try{const d=f.contentDocument;n=parseInt((d.querySelector('#score')?.textContent||'0 / 16').split('/')[0])||0;total=parseInt((d.querySelector('#score')?.textContent||'0 / 16').split('/')[1])||16;kind=d.body.dataset.kind||'';y=parseFloat(d.body.dataset.y||0)||0;hint=d.querySelector('#hint')?.textContent||''}catch(e){}
rank.textContent=rankName(n);const left=Math.max(0,total-n);if(left===0)goal.textContent='ぜんぶ みつけた！';else if(n<3)goal.textContent='まずは 3びき みつけよう';else if(/へんしん/.test(hint))goal.textContent='すきな いきものに へんしん';else goal.textContent='あと '+left+' びき さがそう';
const msgs=kind==='wing'&&y>.2?['はねで ふわふわ','そらから さがそう','あしあと なし'][tick%3]:kind==='water'?['みずべを さがそう','およいで すすもう','みずでは あしあと なし'][tick%3]:['きらりを さがそう','いわや きの うらも みよう','みつけたら ずかんへ'][tick%3];guide.textContent=msgs;tick++}
setInterval(update,1500);setTimeout(update,2500);
</script></body></html>
