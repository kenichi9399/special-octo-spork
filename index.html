<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>いきもの たからさがし 3D</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bcbd4;color:#21343a;font-family:system-ui,"Yu Gothic UI",sans-serif;touch-action:none;user-select:none}
    #game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#8bcbd4}
    .hud{position:fixed;inset:14px 14px auto 14px;display:grid;grid-template-columns:minmax(220px,1fr) min(350px,42vw);gap:10px;pointer-events:none}
    .panel,.book,.toast,.keypad{background:rgba(255,255,255,.9);border:1px solid rgba(35,51,51,.16);border-radius:8px;box-shadow:0 10px 28px rgba(20,40,50,.18);backdrop-filter:blur(12px);pointer-events:auto}
    .panel{display:flex;gap:12px;align-items:center;padding:10px 12px}.face{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#fff4bf;font-size:30px}.title{font-weight:900}.hint{font-size:13px;line-height:1.35}
    .close{margin-left:auto;width:28px;height:28px;border-radius:50%;border:1px solid #ccd;background:#fff;font-weight:900}
    .book{max-height:calc(100vh - 120px);overflow:auto;padding:10px}.bookHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}.score{margin-left:auto;background:#299463;color:#fff;border-radius:999px;padding:5px 8px;font-weight:900;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(78px,1fr));gap:8px}.morph{min-height:70px;border:1px solid #d5ddd6;border-radius:8px;background:#fff;font:inherit;font-weight:800}.morph[disabled]{opacity:.48}.morph.active{outline:3px solid rgba(217,87,127,.28)}
    .toast{position:fixed;left:50%;top:100px;translate:-50% 0;max-width:calc(100vw - 28px);padding:12px 16px;font-weight:900;opacity:0;transform:translateY(-8px);transition:.18s}.toast.show{opacity:1;transform:none}
    .padWrap{position:fixed;right:14px;bottom:14px;display:flex;gap:10px;align-items:end}.pad{width:132px;height:132px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:6px}.pad button,.jump,.respawn{border:1px solid rgba(35,51,51,.18);border-radius:8px;background:rgba(255,255,255,.86);font:inherit;font-weight:900;box-shadow:0 8px 18px rgba(20,40,50,.14)}.up{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.jump{width:78px;height:78px;border-radius:50%;background:#f4b653}.respawn{position:fixed;left:50%;bottom:16px;translate:-50% 0;height:44px;padding:0 18px;border-radius:999px}
    .keypad{position:fixed;left:50%;top:50%;translate:-50% -50%;width:min(320px,calc(100vw - 28px));padding:14px;display:none}.keypad.open{display:block}.code{height:42px;display:grid;place-items:center;background:#fff;border:1px solid #d5ddd6;border-radius:8px;font-size:24px;font-weight:900;letter-spacing:8px;margin:10px 0}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{height:46px;border-radius:8px;border:1px solid #d5ddd6;background:#fff;font:inherit;font-weight:900}
    .openBtn{position:fixed;top:14px;border:1px solid #d5ddd6;border-radius:999px;background:rgba(255,255,255,.9);padding:9px 12px;font-weight:900;display:none}.openBtn.show{display:block}#openTitle{left:14px}#openBook{right:14px}.hide{display:none}
    @media(max-width:760px),(pointer:coarse){.hud{grid-template-columns:1fr}.book{max-height:220px}.grid{grid-template-columns:repeat(4,minmax(64px,1fr))}.morph{min-height:60px;font-size:12px}.respawn{left:14px;translate:0 0}.hint{font-size:12px}}
  </style>
</head>
<body>
<canvas id="game"></canvas>
<button class="openBtn" id="openTitle">タイトル</button><button class="openBtn" id="openBook">ずかん</button>
<div class="hud">
  <section class="panel" id="titlePanel"><div class="face" id="avatar">🙂</div><div><div class="title">いきもの たからさがし</div><div class="hint" id="hint">めずらしい生き物を見つけて、変身しよう。オートセーブします。</div></div><button class="close" id="closeTitle">×</button></section>
  <section class="book" id="bookPanel"><div class="bookHead"><b>ずかん・へんしん</b><span class="score" id="score">0 / 16</span><button class="close" id="closeBook">×</button></div><div class="grid" id="collection"></div></section>
</div>
<div class="toast" id="toast"></div>
<section class="keypad" id="keypad"><div style="display:flex;align-items:center;gap:8px"><b>ひみつの数字</b><button class="close" id="closeKeypad">×</button></div><div class="code" id="code">----</div><div class="keys" id="keys"></div></section>
<button class="respawn" id="respawn">リスポーン</button>
<div class="padWrap"><div class="pad"><button class="up" data-k="KeyW">↑</button><button class="left" data-k="KeyA">←</button><button class="right" data-k="KeyD">→</button><button class="down" data-k="KeyS">↓</button></div><button class="jump" id="jump">JUMP</button></div>
<script>
const $=id=>document.getElementById(id),canvas=$("game"),ctx=canvas.getContext("2d"),avatar=$("avatar"),hint=$("hint"),collection=$("collection"),score=$("score"),keypad=$("keypad"),code=$("code");
const animals=[
["leafy_seadragon","リーフィー","🐟","#7aa45d","#d9c36a",-21,15,5.9,8,"水辺でふわふわ","water"],["echidna","はりもぐら","🦔","#9a6a42","#f7e4b0",18,-12,5.7,8.4,"ウンチに強い","armor"],["axolotl","うーぱー","🦎","#f6b6c8","#ff6f9e",-22,19,6.2,10.5,"水辺で大ジャンプ","water"],["shoebill","はしびろこう","🐦","#6f7f86","#d8d4b8",7,17,6.4,9.4,"空中でゆっくり","wing"],["horned_lizard","つのとかげ","🦎","#b98b5d","#ecd08d",25,7,5.8,8.2,"岩でふんばる","rock"],["owl_moth","ふくろうが","🦋","#7b5c3d","#e4c27a",-3,32,7.1,12.2,"高く舞う","wing"],["pangolin","せんざんこう","🐾","#8a7257","#c9a66b",-30,-24,5.2,7.8,"ゆっくり安定","armor"],["okapi","おかぴ","🐴","#68402d","#f5f0df",2,-29,7.8,8.9,"足が速い","run"],["ayeaye","あいあい","🐒","#3b3028","#d8b089",-35,10,6.6,10.9,"木の近くが得意","tree"],["luna_moth","おおみずあお","🦋","#b9e7b0","#f4fff0",33,-24,7.3,10,"軽く舞う","wing"],["pygmy_hippo","こびとかば","🦛","#5b6874","#bfc8ce",-13,30,5.5,7.6,"水辺で安定","water"],["isopod","ぐそくむし","🪲","#8d95a1","#d7dde4",36,20,5.9,8,"岩とウンチに強い","rock"],["mycena","ひかりきのこ","🍄","#b4f7ff","#4bd8ff",13,-34,5.4,8.2,"結晶で光る","crystal"],["nudibranch","うみうし","🐌","#f28ac8","#69d7ff",-28,29,5.2,7.4,"水辺でゆっくり","water"],["kingfisher","かわせみ","🐦","#1788b8","#f27b35",29,30,7.6,10.4,"すばやく飛ぶ","wing"],["mantis_shrimp","しゃこ","🦐","#58b88f","#f07a58",-18,-3,6.9,8.8,"水辺で速い","water"]].map(a=>({id:a[0],name:a[1],icon:a[2],color:a[3],accent:a[4],x:a[5],z:a[6],speed:a[7],jump:a[8],trait:a[9],kind:a[10]}));
let px=0,pz=8,py=0,vy=0,dir=0,active=localStorage.getItem("hunt-active")||"kid",input="",slowUntil=0,gateOpen=localStorage.getItem("gate-open")==="1",last=performance.now();
const held={},found=new Set(JSON.parse(localStorage.getItem("hunt-found")||"[]")),items=animals.map(a=>({...a,found:found.has(a.id),bob:Math.random()*7}));
const trees=[],crystals=[[-28,30],[35,-25],[30,22],[13,-34]],waters=[[-20,6,12],[-20,20,8]],rocks=[[24,-1,8],[34,20,6],[-31,-25,6]],poops=[[-8,4],[12,8],[20,-18],[-28,-12],[30,18],[-4,28]];
for(let i=0;i<32;i++)trees.push([Math.cos(i)*28+Math.sin(i*3)*8,Math.sin(i)*28+Math.cos(i*2)*8,.8+Math.random()*.7]);
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener("resize",resize);resize();
function save(){localStorage.setItem("hunt-found",JSON.stringify([...found]));localStorage.setItem("hunt-active",active);localStorage.setItem("gate-open",gateOpen?"1":"0")}
function near(list,r=0){return list.some(p=>Math.hypot(px-p[0],pz-p[1])<(p[2]||4)+r)}
function trait(){const a=animals.find(x=>x.id===active);let sm=1,jm=1,grav=26,poop=.48,msg="";if(!a)return{a,sm,jm,grav,poop,msg};if(a.kind==="water"){sm*=near(waters,2)?1.42:.85;if(near(waters,2)){jm*=a.id==="axolotl"?1.25:1;msg="水辺の特性で元気！"}}if(a.kind==="wing"){if(py>0)grav*=.55;msg="羽でゆっくり落ちます。"}if(a.kind==="rock"&&near(rocks,1)){sm*=1.25;poop=.76;msg="岩場でふんばります。"}if(a.kind==="armor")poop=.85;if(a.kind==="tree"&&near(trees.map(t=>[t[0],t[1],3]),1)){sm*=1.14;jm*=1.25;msg="木の近くで身軽！"}if(a.kind==="crystal"&&near(crystals.map(c=>[c[0],c[1],4]),1)){sm*=1.15;jm*=1.15;msg="結晶の近くで光ります。"}if(a.kind==="run"&&held.KeyW)sm*=1.2;return{a,sm,jm,grav,poop,msg}}
function toast(t){hint.textContent=t;const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
function setMorph(id){active=id;avatar.textContent=(animals.find(a=>a.id===id)||{}).icon||"🙂";save();drawBook()}
function drawBook(){collection.innerHTML="";animals.forEach(a=>{const b=document.createElement("button");b.className="morph"+(active===a.id?" active":"");b.disabled=!found.has(a.id);b.innerHTML=`<div style="font-size:26px">${found.has(a.id)?a.icon:"?"}</div><div>${found.has(a.id)?a.name:"???"}</div><small>${found.has(a.id)?a.trait:""}</small>`;b.onclick=()=>{setMorph(a.id);toast(a.name+"にへんしん！ "+a.trait)};collection.append(b)});score.textContent=found.size+" / "+animals.length}
function screen(x,z,y=0){const dx=x-px,dz=z-pz;return [innerWidth/2+(dx-dz)*18,innerHeight/2+70+(dx+dz)*9-y*30]}
function oval(x,y,w,h,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,Math.PI*2);ctx.fill()}
function drawCreature(a,x,z,y=0,scale=1,face=dir,t=0){const [sx,sy]=screen(x,z,y);ctx.save();ctx.translate(sx,sy);ctx.scale(scale,scale);oval(0,12,24,9,"rgba(0,0,0,.18)");ctx.rotate(face);if(a.kind==="wing"){oval(-24,0,26,13,a.accent);oval(24,0,26,13,a.accent)}if(a.kind==="water"){ctx.fillStyle=a.accent;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-34);ctx.lineTo(13,-18);ctx.closePath();ctx.fill()}oval(0,0,a.kind==="wing"?16:24,a.kind==="water"?15:22,a.color);oval(0,-20,15,13,a.color);if(a.kind==="armor"||a.kind==="rock"){ctx.fillStyle=a.accent;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*9,-10);ctx.lineTo(i*9+4,-26);ctx.lineTo(i*9+8,-10);ctx.fill()}}if(a.kind==="run"){ctx.fillStyle=a.accent;for(let i=-1;i<=1;i++)ctx.fillRect(-20,i*8,40,3)}if(a.kind==="crystal"){oval(0,-30,22,10,a.accent);ctx.globalAlpha=.35;oval(0,-28,34,16,a.accent);ctx.globalAlpha=1}ctx.fillStyle="#17202a";oval(-6,-24,2.7,3.2,"#17202a");oval(6,-24,2.7,3.2,"#17202a");ctx.restore()}
function drawWorld(t){const g=ctx.createLinearGradient(0,0,0,innerHeight);g.addColorStop(0,"#a891d8");g.addColorStop(.45,"#93d5c0");g.addColorStop(1,"#3f9f70");ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);for(const w of waters){const [x,y]=screen(w[0],w[1]);oval(x,y,w[2]*20,w[2]*10,"rgba(53,201,214,.72)");ctx.strokeStyle="rgba(220,255,255,.65)";ctx.beginPath();ctx.ellipse(x,y,w[2]*14+Math.sin(t)*8,w[2]*7,0,0,7);ctx.stroke()}for(let i=0;i<14;i++){const [x,y]=screen(-24+i*4,6+Math.sin(i)*3);oval(x,y,40,14,"#d3b06f")}for(const p of crystals){const [x,y]=screen(p[0],p[1]);ctx.fillStyle="#8de6ff";for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x+i*8-16,y);ctx.lineTo(x+i*8-10,y-34-i*5);ctx.lineTo(x+i*8-2,y);ctx.fill()}}for(const tr of trees){const [x,y]=screen(tr[0],tr[1]);ctx.fillStyle="#7a4f2c";ctx.fillRect(x-5*tr[2],y-44*tr[2],10*tr[2],44*tr[2]);ctx.fillStyle="#2f8f65";ctx.beginPath();ctx.arc(x,y-54*tr[2],30*tr[2],0,7);ctx.fill()}for(const p of poops){const [x,y]=screen(p[0],p[1]);oval(x,y,14,8,"#6b3f22");oval(x,y-7,10,6,"#6b3f22");oval(x,y-13,6,4,"#6b3f22")}if(!gateOpen){const [x,y]=screen(-30,-28);ctx.fillStyle="#70514a";ctx.fillRect(x-45,y-70,90,70);ctx.fillStyle="#fff7cf";ctx.fillRect(x-30,y-62,60,24);ctx.fillStyle="#26333f";ctx.font="900 18px system-ui";ctx.textAlign="center";ctx.fillText("123",x,y-44)}const order=[...items.filter(i=>!found.has(i.id)),{player:1,x:px,z:pz}].sort((a,b)=>(a.x+a.z)-(b.x+b.z));for(const o of order){if(o.player)drawCreature(trait().a||{color:"#4aa7c7",accent:"#ffcf9f",kind:"kid"},px,pz,py,1.15,dir,t);else{drawCreature(o,o.x,o.z,Math.sin(t*2+o.bob)*.08,.75,Math.sin(t+o.bob)*.2,t)}}}
function update(dt){if(!keypad.classList.contains("open")){const f=(held.KeyW?1:0)-(held.KeyS?1:0),s=(held.KeyD?1:0)-(held.KeyA?1:0),tr=trait(),slow=performance.now()<slowUntil?tr.poop:1,spd=(tr.a?tr.a.speed:6.4)*tr.sm*slow;if(f||s){dir=Math.atan2(s,-f);px+=Math.sin(dir)*spd*dt;pz-=Math.cos(dir)*spd*dt}vy-=tr.grav*dt;py+=vy*dt;if(py<0){py=0;vy=0}for(const p of poops){if(Math.hypot(px-p[0],pz-p[1])<1.2){slowUntil=performance.now()+4200;toast(tr.poop>.8?"特性でウンチでもあまり遅くならない！":"ウンチをふんだ！足がゆっくりに。")}}if(!gateOpen&&Math.hypot(px+30,pz+28)<3)openPad();px=Math.max(-55,Math.min(55,px));pz=Math.max(-55,Math.min(55,pz))}for(const it of items){if(!found.has(it.id)&&Math.hypot(px-it.x,pz-it.z)<1.6){found.add(it.id);save();drawBook();toast(it.icon+" "+it.name+"をみつけた！")}}}
function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;update(dt);drawWorld(now/1000);requestAnimationFrame(loop)}
function doRespawn(){px=0;pz=8;py=0;vy=0;slowUntil=0;closePad();toast("スタートにもどりました。")}
function openPad(){keypad.classList.add("open");input="";code.textContent="----"}function closePad(){keypad.classList.remove("open");input="";code.textContent="----"}
["1","2","3","4","5","6","7","8","9","けす","0","OK"].forEach(l=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>{if(l==="けす")input="";else if(l==="OK"){if(input==="123"){gateOpen=true;save();closePad();toast("扉がひらいた！")}else{input="";toast("もういちど数字を見てみよう。")}}else if(input.length<3)input+=l;code.textContent=input.padEnd(4,"-")};$("keys").append(b)});
addEventListener("keydown",e=>{held[e.code]=1;if(e.code==="Space")$("jump").click();if(e.code==="Escape")closePad()});addEventListener("keyup",e=>held[e.code]=0);document.querySelectorAll("[data-k]").forEach(b=>{b.onpointerdown=e=>{e.preventDefault();held[b.dataset.k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>held[b.dataset.k]=0});$("jump").onclick=()=>{if(py>0||keypad.classList.contains("open"))return;const tr=trait();vy=(tr.a?tr.a.jump:8.7)*tr.jm;if(tr.msg)toast(tr.msg)};$("respawn").onclick=doRespawn;$("closeKeypad").onclick=closePad;$("closeTitle").onclick=()=>{$("titlePanel").classList.add("hide");$("openTitle").classList.add("show")};$("openTitle").onclick=()=>{$("titlePanel").classList.remove("hide");$("openTitle").classList.remove("show")};$("closeBook").onclick=()=>{$("bookPanel").classList.add("hide");$("openBook").classList.add("show")};$("openBook").onclick=()=>{$("bookPanel").classList.remove("hide");$("openBook").classList.remove("show")};
if(active!=="kid"&&!found.has(active))active="kid";setMorph(active);drawBook();toast("外部ライブラリなしで起動しました。");requestAnimationFrame(loop);if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
