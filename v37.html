<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>いきもの たからさがし 3D</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#7dbfd1;color:#21343a;font-family:system-ui,"Yu Gothic UI",sans-serif}.load{font-weight:900;font-size:18px;text-align:center}</style></head><body><div class="load">3Dを よみこみちゅう...</div><script>
(async()=>{
const u='https://cdn.jsdelivr.net/gh/kenichi9399/special-octo-spork@bc2fde0541d94452cb2106934f20cc1ecf00894a/index.html';
let s=await fetch(u,{cache:'no-store'}).then(r=>r.text());
const add=`\n<style>.quest{position:fixed;right:14px;top:88px;width:min(260px,42vw);padding:10px 12px;background:rgba(255,255,255,.88);border:1px solid rgba(35,51,51,.16);border-radius:8px;box-shadow:0 10px 24px rgba(20,40,50,.14);font-weight:900;pointer-events:auto}.quest small{display:block;font-size:12px;font-weight:800;line-height:1.35;margin-top:4px}.guide{position:fixed;left:50%;top:56px;translate:-50% 0;background:rgba(255,255,255,.9);border:1px solid rgba(35,51,51,.16);border-radius:999px;padding:8px 12px;font-weight:900;box-shadow:0 8px 18px rgba(20,40,50,.12);pointer-events:none}.rank{display:inline-block;margin-left:6px;background:#f4b653;border-radius:999px;padding:3px 7px;color:#29353a}@media(max-width:760px),(pointer:coarse){.quest{top:auto;right:12px;bottom:112px;width:min(220px,46vw);font-size:12px}.guide{top:52px;font-size:12px}}</style>\n<section class="quest" id="quest"><div>もくひょう <span class="rank" id="rank">たまご</span></div><small id="questText">いきものを さがそう</small></section><div class="guide" id="guide">きらりを さがそう</div>`;
s=s.replace('<div class="toast" id="toast"></div>',add+'<div class="toast" id="toast"></div>');
const patch=`\nconst rankEl=document.getElementById("rank"),questText=document.getElementById("questText"),guideEl=document.getElementById("guide");let guideTick=0,lastFoundCount=found.size;function rankName(n){return n>=12?"もりの せんせい":n>=8?"はかせ":n>=5?"たんけんか":n>=2?"みならい":"たまご"}function nearTarget(){let best=null,bd=1e9;for(const a of animals){if(found.has(a.id))continue;const d=Math.hypot(px-a.x,pz-a.z);if(d<bd){bd=d;best=a}}return{best,bd}}const oldDrawBook2=drawBook;drawBook=function(){oldDrawBook2();if(rankEl)rankEl.textContent=rankName(found.size);if(questText){const left=animals.length-found.size;questText.textContent=left<=0?"ぜんぶ みつけた！":found.size<3?"まずは 3びき みつけよう":active==="kid"?"ずかんで へんしんしよう":"つぎの いきものを さがそう"}if(found.size>lastFoundCount){toast("ランク: "+rankName(found.size));lastFoundCount=found.size}};const oldWorld2=world;world=function(t){oldWorld2(t);if(++guideTick%12===0&&guideEl){const g=nearTarget();if(g.best){guideEl.textContent=g.bd<5?"すぐ ちかく！":g.bd<16?"きらり ちかい":g.best.kind==="water"?"みずべを さがそう":g.best.kind==="wing"?"たかい ところを みよう":g.best.kind==="rock"?"いわばを さがそう":g.best.kind==="crystal"?"ひかる ばしょへ":"もりを さがそう"}else guideEl.textContent="ぜんぶ みつけた！"}const g=nearTarget();if(g.best&&g.bd<28){const dx=g.best.x-px,dz=g.best.z-pz,a=Math.atan2(dx,dz);obj(M.fineCone,px+Math.sin(a)*2.0,hgt(px,pz)+1.0,pz+Math.cos(a)*2.0,.12,.42,.12,[1,.86,.26],a,Math.PI/2,.70)}};drawBook();\n`;
s=s.replace('if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));',patch+'if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));');
s=s.replace(/ikimono-hunt-v\d+/g,'ikimono-hunt-v37');
document.open();document.write(s);document.close();
})().catch(e=>{document.body.innerHTML='<div class="load">よみこみに しっぱいしました<br>'+e.message+'</div>'});
</script></body></html>
