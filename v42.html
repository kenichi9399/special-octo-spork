<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>いきもの たからさがし 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7dbfd1;font-family:system-ui,"Yu Gothic UI",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.closeGoal{position:fixed;right:10px;top:58px;z-index:5;width:34px;height:34px;border-radius:50%;border:1px solid rgba(35,51,51,.18);background:rgba(255,255,255,.94);box-shadow:0 8px 18px rgba(20,40,50,.16);font-weight:900;font-size:20px}.openGoal{position:fixed;right:10px;top:58px;z-index:5;border-radius:999px;border:1px solid rgba(35,51,51,.18);background:rgba(255,255,255,.94);box-shadow:0 8px 18px rgba(20,40,50,.16);font-weight:900;padding:8px 12px;display:none}@media(max-width:760px),(pointer:coarse){.closeGoal,.openGoal{top:auto;right:10px;bottom:72px}}</style></head><body><iframe id="shell" src="./v41.html?fresh=3" allow="fullscreen"></iframe><button class="closeGoal" id="closeGoal">×</button><button class="openGoal" id="openGoal">もくひょう</button><script>
const shell=document.getElementById('shell'),closeGoal=document.getElementById('closeGoal'),openGoal=document.getElementById('openGoal');let hidden=false;
function setGoal(show){hidden=!show;closeGoal.style.display=show?'block':'none';openGoal.style.display=show?'none':'block';try{const d=shell.contentDocument;const g=d.querySelector('.goal');if(g)g.style.display=show?'block':'none'}catch(e){}}
closeGoal.onclick=()=>setGoal(false);openGoal.onclick=()=>setGoal(true);
function patch(){try{const d=shell.contentDocument;if(!d)return;const g=d.querySelector('.goal');if(g)g.style.display=hidden?'none':'block';const inner=d.querySelector('#game');const gd=inner&&inner.contentDocument;if(gd&&!gd.getElementById('v42-style')){const st=gd.createElement('style');st.id='v42-style';st.textContent='.respawn{left:50%!important;right:auto!important;bottom:154px!important;translate:-50% 0!important;z-index:30!important}.padWrap{z-index:25!important}.joy{z-index:25!important}.jump{z-index:25!important}@media(min-width:900px){.respawn{bottom:18px!important}}';gd.head.appendChild(st)} }catch(e){} }
setInterval(patch,700);shell.addEventListener('load',()=>setTimeout(patch,1200));
</script></body></html>
